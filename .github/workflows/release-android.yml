name: Publish Android release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.5.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Check, sign and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and source
        run: |
          python3 scripts/release_metadata.py validate --tag "$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter SDK
        run: |
          bash scripts/bootstrap_flutter.sh "$RUNNER_TEMP/five-more-flutter"
          echo "$RUNNER_TEMP/five-more-flutter/bin" >> "$GITHUB_PATH"
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ['ANDROID_KEYSTORE_BASE64']
          if not value:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 is not configured')
          Path(os.environ['RUNNER_TEMP'], 'five-more-signing.jks').write_bytes(
              base64.b64decode(value, validate=True))
          PY
      - name: Build signed universal APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/five-more-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - name: Native alarm rules tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Verify signature, package, version and contents
        run: |
          python3 scripts/release_metadata.py package \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --output release-artifacts
          cp "docs/releases/$RELEASE_TAG.md" release-artifacts/release-notes.md
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/five-more-signing.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-${{ env.RELEASE_TAG }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified APK to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-${{ env.RELEASE_TAG }}
          path: release-artifacts
      - name: Create or resume draft release
        working-directory: release-artifacts
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/release.json" > /dev/null || {
              echo 'This version is already published. Create a new version instead.' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Ещё пять ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            ./*.apk ./*-sha256.txt ./*-build-info.json
      - name: Verify uploaded assets before publication
        run: |
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-download" \
            --pattern '*.apk' --pattern '*-sha256.txt' --pattern '*-build-info.json'
          cd "$RUNNER_TEMP/release-download"
          sha256sum --check ./*-sha256.txt
          for file in *; do cmp "$file" "$GITHUB_WORKSPACE/release-artifacts/$file"; done
      - name: Publish update for Obtainium
        working-directory: release-artifacts
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest \
            --notes-file release-notes.md
          echo "Release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
